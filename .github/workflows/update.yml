name: Turkce Hutbeleri Guncelle

on:
  schedule:
    - cron: '30 18 * * 4' # Her Perşembe TSİ 21:30
    - cron: '0 5 * * 5'  # Her Cuma TSİ 08:00
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Tüm git geçmişini alarak rebase çakışmalarını önler

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri Yükle
        run: pip install requests beautifulsoup4 urllib3

      - name: Scraper'ı Çalıştır
        run: python scraper.py

      - name: Değişiklikleri Senkronize Et ve Push Yap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hutbeler.json
          git diff --staged --quiet || (git commit -m "Auto-update: Turkce hutbeler guncellendi" && git pull --rebase origin main && git push origin main)
