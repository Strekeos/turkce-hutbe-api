name: Turkce Hutbeleri Guncelle

on:
  schedule:
    - cron: '30 18 * * 4'
    - cron: '0 5 * * 5'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri Yukle
        run: pip install requests beautifulsoup4

      - name: Scraperi Calistir
        run: python scraper.py

      - name: Degisiklikleri Gonder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hutbeler.json
          git diff --staged --quiet || (git commit -m "Auto-update: Turkce hutbeler guncellendi" && git pull --rebase origin main && git push origin main)
